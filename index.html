<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woxsen University - Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">🎓 Woxsen University</a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">
        ☰
      </button>
      <ul class="nav-links" id="nav-links"></ul>
    </nav>
  </header>

  <main class="container">
    <section aria-labelledby="hero-title">
      <h1 id="hero-title"></h1>
      <div id="hero-intro"></div>
    </section>

    <section aria-labelledby="notice-title">
      <div class="notice-box">
        <strong>📢 Latest Notice:</strong>
        <span id="notice">Click a button below to view the latest announcement</span>
      </div>

      <div id="notice-buttons"></div>
    </section>

    <section aria-labelledby="highlights-title">
      <h2 id="highlights-title">Our Campus Highlights</h2>
      <ul id="highlights-list"></ul>
    </section>

    <section aria-labelledby="reasons-title">
      <h2 id="reasons-title">Why Choose Woxsen University?</h2>
      <ol id="reasons-list"></ol>
    </section>
  </main>

  <footer>
    <p id="footer-text"></p>
  </footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
  <script src="nav.js"></script>
</body>
</html>
