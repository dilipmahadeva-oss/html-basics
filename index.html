<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Woxsen University</title>

<!-- Page-wide styles for layout, typography, and button behavior -->
<style>

body{

/* Basic page styling for font, background, and centered content */

font-family:Arial;

background:#eef2f5;

text-align:center;

padding:40px;

}

.container{

/* White content box with padding, rounded corners, and shadow */

background:white;

padding:30px;

border-radius:10px;

width:600px;

margin:auto;

box-shadow:0 2px 10px rgba(0,0,0,.2);

}

button{

/* Primary button appearance and clickable styling */

padding:12px 20px;

background:#0d6efd;

color:white;

border:none;

border-radius:5px;

cursor:pointer;

font-size:16px;

}

button:hover{

/* Hover state for better button feedback */

background:#084298;

}

</style>

</head>

<body>

<!-- Main page container holding heading, description, and notice button -->
<div class="container">

<h1>Woxsen University</h1>

<p>

Welcome to our Student Portal.

</p>

<!-- Button triggers JavaScript to display the latest notice -->
<button onclick="showMessage()">

View Latest Notice

</button>

<!-- Notice output is inserted here by the script -->
<p id="notice"></p>

</div>

<script>

// JavaScript function to show the latest notice in the page
function showMessage(){

  document.getElementById("notice").innerHTML=

  "Admissions Open for Academic Year 2026.";

}

</script>

</body>

</html>
